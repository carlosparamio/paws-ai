<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PAWS-AI</title>
    <link rel="stylesheet" href="/styles.css?v=2">
  </head>
  <body>
    <main class="game-shell no-graphics">
      <div id="debugPauseOverlay" class="debug-pause-overlay" hidden>
        <span class="debug-pause-icon" aria-hidden="true"></span>
        <span id="debugPauseText">Debugger paused</span>
      </div>

      <section id="graphicsPane" class="graphics-pane" hidden>
        <canvas id="screen" width="256" height="96" aria-label="Location graphic"></canvas>
        <img id="aiScreen" class="ai-screen" alt="" hidden>
        <div id="screenText" class="screen-text" aria-hidden="true"></div>
      </section>

      <section id="outputPane" class="output-pane">
        <div id="transcript" class="transcript" aria-live="polite"></div>
      </section>

      <form id="commandForm" class="prompt-row">
        <span id="promptMark" class="prompt-mark">&gt;</span>
        <input id="commandInput" autocomplete="off" spellcheck="false" aria-label="Command">
      </form>
    </main>

    <script src="/app.js?v=2"></script>
  </body>
</html>
